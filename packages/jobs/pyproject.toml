[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf2l-jobs"
version = "0.1.0.dev0"
description = "Sandboxed training and offline build adapters for the Go HF2L manager"
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = ["pydantic>=2.9,<3"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15"]

[project.optional-dependencies]
build = ["build>=1.2.2", "packaging>=24"]

[project.scripts]
hf2l-jobs-runtime = "hf2l_jobs.runtime:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
where = ["src"]
include = ["hf2l_jobs*"]
