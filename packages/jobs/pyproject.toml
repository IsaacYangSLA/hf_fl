[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf2l-jobs"
version = "0.1.0.dev0"
description = "Isolated multi-job lifecycle management for HF2L"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "sqlalchemy>=2,<3", "fastapi>=0.115,<1", "httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3", "cryptography>=43"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
server = ["uvicorn>=0.30,<1", "psycopg[binary]>=3,<4"]
test = ["httpx>=0.27,<1"]
build = ["build>=1.2.2", "twine>=5.1.0"]

[project.scripts]
hf2l-jobs = "hf2l_jobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hf2l_jobs*"]

[tool.setuptools.package-data]
hf2l_jobs = ["static/*", "static/**/*", "templates/*", "templates/**/*"]
