[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf2l"
dynamic = ["version"]
description = "Framework-independent federated learning and authenticated exchange adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "safetensors>=0.4.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["federated-learning", "hugging-face", "fedavg", "exchange"]

[project.optional-dependencies]
torch = ["torch>=2.2.0"]
hf = ["huggingface_hub>=0.32.0"]
examples = ["torch>=2.2.0", "huggingface_hub>=0.32.0"]
exchange = ["hf2l-exchange==0.1.0.dev0"]
service = [
  "hf2l-exchange[server]==0.1.0.dev0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4", "boto3>=1.35,<2", "PyJWT[crypto]>=2.9,<3",
  "jsonschema>=4.18,<5",
]
exchange-test = ["hf2l-exchange[test]==0.1.0.dev0", "moto[s3,server]>=5,<6", "httpx>=0.27,<1"]
build = [
  "build>=1.2.2",
  "setuptools-scm>=9.2",
  "twine>=5.1.0",
]
jfrog = [
  "huggingface_hub>=0.32.0,<=1.18.0",
]

[project.urls]
Homepage = "https://github.com/IsaacYangSLA/hf_fl"
Repository = "https://github.com/IsaacYangSLA/hf_fl"
Documentation = "https://github.com/IsaacYangSLA/hf_fl#readme"

[project.scripts]
hf2l = "hf2l.cli:main"
hf2l-init-repo = "hf2l.init_repo:main"
hf2l-client-download = "hf2l.client_download:main"
hf2l-client-train = "hf2l.client_train:main"
hf2l-client-upload = "hf2l.client_upload:main"
hf2l-create-allowlist = "hf2l.create_allowlist:main"
hf2l-owner-fedavg = "hf2l.owner_fedavg:main"
hf2l-exchange-service = "hf2l.exchange.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hf2l", "hf2l.*", "examples"]
exclude = ["tests", "tests.*", "packages", "packages.*"]
