name: HF2L architecture and exchange tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-numpy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the framework-independent application core
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip check
      - name: Verify clean core installation and actual NumPy aggregation
        run: .venv/bin/python scripts/check_hf2l_dependencies.py --mode core
      - name: Enforce both distribution boundaries, frozen oracles and core contracts
        run: >-
          .venv/bin/python -m unittest
          tests.test_layering tests.test_architecture_v3
          tests.test_protocol_v3 tests.test_checkpoint_v3
          tests.test_listener_workflow tests.test_listener_cli
          tests.test_listener_engine tests.test_owner_listener
          tests.test_owner_listener_cli tests.test_runner_publication_hook -v

  sdk-boundaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the standalone Python SDK without server or ML dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e './packages/exchange[test]'
          .venv/bin/python scripts/check_exchange_dependencies.py --mode sdk
          .venv/bin/python -m pip check
      - name: Verify Python SDK wire, transfer, and recovery contracts
        run: .venv/bin/python -m unittest discover -s packages/exchange/tests -v

  hf2l-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXCHANGE_REQUIRE_TESTS: '1'
    strategy:
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/exchange/go.sum
      - name: Build the native Exchange for application integration tests
        run: |
          go -C packages/exchange build -trimpath -o "$RUNNER_TEMP/hf2l-exchange" ./cmd/hf2l-exchange
          chmod 0755 "$RUNNER_TEMP/hf2l-exchange"
          printf 'HF2L_EXCHANGE_GO_BINARY=%s\n' "$RUNNER_TEMP/hf2l-exchange" >> "$GITHUB_ENV"
      - name: Install Python training, clients, and application test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -e './packages/exchange[test]' -e '.[torch,hf,examples,exchange,exchange-test]' 'PyJWT[crypto]' boto3 'moto[s3,server]'
      - name: Run application, numeric golden, architecture, and participant regressions
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check distribution metadata consistency
        run: .venv/bin/python -m pip check
