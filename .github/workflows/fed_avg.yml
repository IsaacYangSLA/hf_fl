name: FedAvg on Hugging Face

on:
  repository_dispatch:
    types: [hf-pr-update]
  workflow_dispatch:

permissions:
  contents: read

# Serialize readiness checks and publication, including duplicate webhook deliveries.
concurrency:
  group: hf-fedavg-${{ vars.HF_REPO_ID }}
  cancel-in-progress: false

env:
  HF_REPO_ID: ${{ vars.HF_REPO_ID }}
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  check_prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      base_revision: ${{ steps.check.outputs.base_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install HF2L with CPU PyTorch
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install '.[hf]'
      - name: Check current-round PRs
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PARTICIPANT_ALLOWLIST: ${{ secrets.HF_PARTICIPANT_ALLOWLIST }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from hf2l.allowlist import load_allowlist

          for name in ("HF_REPO_ID", "HF_TOKEN", "HF_PARTICIPANT_ALLOWLIST"):
              if not os.environ.get(name):
                  raise SystemExit(f"Configure {name} in GitHub Actions settings")
          path = Path("participant_allowlist.json")
          path.write_text(os.environ["HF_PARTICIPANT_ALLOWLIST"], encoding="utf-8")
          if len(load_allowlist(path)) < 2:
              raise SystemExit("The allowlist must contain at least two participants")
          PY
          .venv/bin/python -m hf2l.owner_fedavg \
            --repo-id "$HF_REPO_ID" \
            --discover-prs \
            --allowlist participant_allowlist.json \
            --output-dir work/readiness \
            --check-only
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          result = json.loads(Path("work/readiness/readiness.json").read_text())
          base = result["base_revision"]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("Expected an immutable Hugging Face commit SHA")
          ready = str(result["ready"]).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={ready}\nbase_revision={base}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Eligible PRs: {result['eligible_count']}\n\nBase: `{base}`\n\nReady: {ready}\n")
          PY

  fed_avg:
    needs: check_prs
    if: needs.check_prs.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install HF2L with CPU PyTorch
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install '.[hf]'
      - name: Validate, average, and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PARTICIPANT_ALLOWLIST: ${{ secrets.HF_PARTICIPANT_ALLOWLIST }}
          EXPECTED_BASE_REVISION: ${{ needs.check_prs.outputs.base_revision }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          for name in ("HF_REPO_ID", "HF_TOKEN", "HF_PARTICIPANT_ALLOWLIST", "EXPECTED_BASE_REVISION"):
              if not os.environ.get(name):
                  raise SystemExit(f"Missing {name}")
          Path("participant_allowlist.json").write_text(
              os.environ["HF_PARTICIPANT_ALLOWLIST"], encoding="utf-8"
          )
          PY
          .venv/bin/python -m hf2l.owner_fedavg \
            --repo-id "$HF_REPO_ID" \
            --discover-prs \
            --allowlist participant_allowlist.json \
            --expected-base-revision "$EXPECTED_BASE_REVISION" \
            --output-dir work/fedavg \
            --publish
