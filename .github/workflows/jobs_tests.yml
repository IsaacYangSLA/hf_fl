name: Python execution adapters and distribution boundaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the independent Python execution-adapter distribution
        run: |
          python -m pip install build twine
          python -m build --outdir dist packages/jobs
          python -m twine check dist/*
      - name: Install a clean adapter wheel without training or server dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install dist/hf2l_jobs-*.whl
          .venv/bin/python -m pip check
          .venv/bin/python scripts/check_jobs_dependencies.py --mode runtime
      - name: Verify only execution-adapter commands are installed
        run: |
          .venv/bin/hf2l-jobs-runtime --help
          .venv/bin/python -m hf2l_jobs.runtime --help
          .venv/bin/python - <<'PYTHON'
          from importlib.metadata import distribution
          entries = {entry.name for entry in distribution('hf2l-jobs').entry_points
                     if entry.group == 'console_scripts'}
          assert 'hf2l-jobs-runtime' in entries
          assert 'hf2l-jobs' not in entries, 'The Python wheel must not shadow the Go service'
          PYTHON

  distribution-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the application, SDK, and execution-adapter distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          python -m build --outdir dist packages/exchange
          python -m build --outdir dist packages/jobs
          python -m twine check dist/*
      - name: Verify source archives contain the implementation, dashboard, and deployment sources
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import tarfile
          import zipfile
          root = Path.cwd()
          def source_file(path):
              return path.is_file() and not any(
                  part == "__pycache__" or part.endswith((".egg-info", ".dist-info"))
                  for part in path.parts
              )
          def package_sources(base):
              return [path for path in (base / "src").rglob("*") if source_file(path) and
                      (path.suffix == ".py" or base == root and
                       ("/static/" in path.as_posix() or "/templates/" in path.as_posix()))]
          for artifact in Path("dist").glob("*.tar.gz"):
              if artifact.name.startswith("hf2l_jobs-"):
                  base = root / "packages/jobs"
                  files = [base / name for name in ("README.md", "pyproject.toml", "MANIFEST.in")]
                  files += package_sources(base)
              elif artifact.name.startswith("hf2l_exchange-"):
                  base = root / "packages/exchange"
                  files = [base / name for name in ("README.md", "pyproject.toml")]
                  files += package_sources(base)
              else:
                  base = root
                  files = [base / name for name in ("README.md", "pyproject.toml", "MANIFEST.in")]
                  files += list((root / "hf2l").rglob("*.py"))
                  files += [path for path in (root / "examples/first_federation").rglob("*")
                            if source_file(path) and (path.suffix in {".py", ".json", ".yaml", ".txt"} or
                            path.name.startswith("Dockerfile") or path.name == "Caddyfile")]
                  files += [path for base in (root / "packages/jobs", root / "packages/exchange")
                            for path in base.rglob("*") if source_file(path) and
                            (path.suffix in {".go", ".json", ".sql", ".md", ".txt"} or path.name in {"go.mod", "go.sum"})]
                  files += [path for path in (root / "deploy/compose").rglob("*") if source_file(path) and
                            (path.suffix in {".md", ".yaml"} or path.name.startswith("Dockerfile"))]
                  files += [root / "packages/jobs" / name for name in ("README.md", "pyproject.toml", "MANIFEST.in")]
                  files += package_sources(root / "packages/jobs") + package_sources(root / "packages/exchange")
                  files += [path for path in (root / "packages/jobs/src/hf2l_jobs/static").rglob("*")
                            if source_file(path)]
                  files += [path for path in (root / "deploy/jobs").rglob("*") if source_file(path) and
                            (path.suffix in {".py", ".md", ".go", ".json"} or path.name.startswith("Dockerfile") or path.name in {"go.mod", "go.sum"})]
              with tarfile.open(artifact, "r:gz") as archive:
                  members = {entry.name.partition("/")[2]: entry for entry in archive.getmembers() if entry.isfile()}
                  for path in files:
                      relative = path.relative_to(base).as_posix()
                      assert relative in members, f"{artifact.name} missing {relative}"
                      assert archive.extractfile(members[relative]).read() == path.read_bytes(), f"{artifact.name} differs at {relative}"
              print(f"{artifact.name}: verified {len(files)} source files")
          for artifact in Path("dist").glob("*.whl"):
              if artifact.name.startswith("hf2l_jobs-"):
                  packages = {"hf2l_jobs": root / "packages/jobs/src/hf2l_jobs"}
              elif artifact.name.startswith("hf2l_exchange-"):
                  packages = {"hf2l_exchange": root / "packages/exchange/src/hf2l_exchange"}
              else:
                  packages = {"hf2l": root / "hf2l", "examples": root / "examples"}
              with zipfile.ZipFile(artifact) as archive:
                  count = 0
                  for name, base in packages.items():
                      for path in base.rglob("*"):
                          if source_file(path) and path.suffix == ".py":
                              member = name + "/" + path.relative_to(base).as_posix()
                              assert member in archive.namelist(), f"{artifact.name} missing {member}"
                              assert archive.read(member) == path.read_bytes(), f"{artifact.name} differs at {member}"
                              count += 1
              print(f"{artifact.name}: verified {count} modules/assets")
          PYTHON

  adapter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only execution-adapter and SDK test packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ./packages/jobs -e './packages/exchange[test]' build
          .venv/bin/python -m pip check
          .venv/bin/python scripts/check_jobs_dependencies.py
          .venv/bin/python scripts/check_exchange_dependencies.py
      - name: Run adapter inputs, build, recovery, and helper specification tests
        run: .venv/bin/python -m unittest discover -s packages/jobs/tests -v

  sandbox-worker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      JOBS_REQUIRE_RUNTIME_TESTS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the separately composed CPU training runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -e ./packages/jobs -e './packages/exchange[test]' -e '.[torch,hf,examples,exchange,exchange-test]' 'build==1.6.1' 'wheel==0.48.0'
          .venv/bin/python -m pip check
      - name: Exercise local training rounds, private build products, and recovery
        run: |
          .venv/bin/python -m unittest discover -s packages/jobs/tests -p 'test_runtime*.py' -v
          .venv/bin/python -m unittest discover -s packages/jobs/tests -p 'test_build*.py' -v
      - name: Preserve submission recovery, client listeners, and cyclic training
        run: .venv/bin/python -m unittest tests.test_submission_intent tests.test_client_listener tests.test_cyclic_handoffs -v
